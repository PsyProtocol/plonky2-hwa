name: PR check

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  pr_check:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Check for spam PR
        id: check
        env:
          RESTRICTED_KEYWORDS_JSON: ${{ secrets.RESTRICTED_KEYWORDS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import json
          import os

          keywords = json.loads(os.environ.get("RESTRICTED_KEYWORDS_JSON") or "[]")
          if not isinstance(keywords, list) or not all(isinstance(word, str) for word in keywords):
              raise ValueError("Restricted keywords must be a JSON array of strings")
          content = (os.environ.get("PR_TITLE", "") + "\n" + os.environ.get("PR_BODY", "")).casefold()
          is_spam = any(word and word.casefold() in content for word in keywords)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"is_spam={str(is_spam).lower()}\n")
          PY

      - name: Close PR if spam are found and author is not a contributor or member
        if: ${{ env.is_spam == 'true' && github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' }}
        run: gh pr close "$PR_NUMBER" --comment "Spam detected"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
